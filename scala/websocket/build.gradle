import play.gradle.Language
import play.gradle.plugin.PlayPlugin

plugins {
    alias(libs.plugins.twirl)
    alias(libs.plugins.play)
    alias(libs.plugins.node)
}

play {
    lang = Language.SCALA
}

def scalaBinaryVersion = System.getProperty('scala.version', PlayPlugin.DEFAULT_SCALA_VERSION).with {
    it.startsWith('3') ? '3' : it.tokenize('.').take(2).join('.')
}
def server = System.getProperty('backend.server', 'pekko-http').with {if (it == "pekko") "pekko-http" else it }

scala {
    scalaVersion = providers.systemProperty('scala.version')
}

twirl {
    scalaVersion = scalaBinaryVersion
}

dependencies {
    implementation "org.playframework:play-${server}-server_${scalaBinaryVersion}:${libs.versions.play.get()}"
    implementation "org.playframework:play-guice_${scalaBinaryVersion}:${libs.versions.play.get()}"
    implementation "org.playframework:play-filters-helpers_${scalaBinaryVersion}:${libs.versions.play.get()}"
    implementation "org.playframework:play-logback_${scalaBinaryVersion}:${libs.versions.play.get()}"
    implementation libs.flot
    implementation libs.bootstrap
    implementation "org.webjars:webjars-play_${scalaBinaryVersion}:${libs.versions.webjars.play.get()}"
    implementation "org.playframework:play-ahc-ws_${scalaBinaryVersion}:${libs.versions.play.get()}"

    testImplementation "org.scalatestplus.play:scalatestplus-play_${scalaBinaryVersion}:${libs.versions.scalatestplus.play.get()}"
    testImplementation libs.awaitility
    testRuntimeOnly "org.scalatestplus:junit-5-14_${scalaBinaryVersion}:${libs.versions.scalatestplus.asProvider().get()}"
}

sourceSets {
    main {
        twirl {
            templateImports.add("views.html.helper.CSPNonce")
        }
    }
}

tasks.register("compileCoffeeScript", NpxTask) {
    dependsOn npmInstall
    def destDir = sourceSets.main.assets.destinationDirectory
    command = "coffee"
    args = ["-c", "-m", "-o", destDir.get().toString(), "app/assets/"]
    inputs.files("app/assets/javascripts/")
    outputs.dir(destDir)
}

tasks.register("compileLess", NpxTask) {
    dependsOn(tasks.npmInstall)
    def destDir = sourceSets.main.assets.destinationDirectory.dir("stylesheets")
    command = "lessc"
    args = ["-x", "app/assets/stylesheets/main.less", destDir.get().file("main.min.css").toString()]
    inputs.files("app/assets/stylesheets/")
    outputs.dir(destDir)
}

tasks.processAssets {
    dependsOn(compileCoffeeScript, compileLess)
}

run {
    systemProperties System.properties
}

tasks.withType(ScalaCompile) {
    scalaCompileOptions.additionalParameters = ["-feature"]
}

test {
    useJUnitPlatform {
        includeEngines 'scalatest'
    }
}

// TODO: Remove after release Play Gradle Plugin
repositories {
    mavenCentral()
    maven {
        url = uri("https://central.sonatype.com/repository/maven-snapshots")
    }
    maven {
        url = uri("https://repository.apache.org/content/repositories/snapshots/")
    }
    mavenLocal()
}

// Play 3.1 requires Java 17, including the Scala compiler's Java output target.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(ScalaCompile).configureEach {
    options.compilerArgs += ["--release", "17"]
    scalaCompileOptions.additionalParameters = (scalaCompileOptions.additionalParameters ?: []) + "-release:17"
}
