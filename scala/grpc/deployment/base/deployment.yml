---
apiVersion: "apps/v1"
kind: Deployment
metadata:
  name: "play-scala-grpc-example-v1-0-snapshot"
  labels:
    appName: "play-scala-grpc-example"
    appNameVersion: "play-scala-grpc-example-v1-0-snapshot"
spec:
  replicas: 2
  selector:
    matchLabels:
      appNameVersion: "play-scala-grpc-example-v1-0-snapshot"
  template:
    metadata:
      labels:
        appName: "play-scala-grpc-example"
        appNameVersion: "play-scala-grpc-example-v1-0-snapshot"
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: "play-scala-grpc-example"
          image: "play-scala-grpc-example:1.0-SNAPSHOT"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: "JAVA_OPTS"
              value: "-Dplay.filters.hosts.allowed.0=myservice.example.org -Dplay.server.pidfile.path=/dev/null"
            - name: "APPLICATION_SECRET"
              valueFrom:
                secretKeyRef:
                  name: "play-scala-grpc-example"
                  key: "application-secret"
            - name: "TRANSPORT_HTTP_BIND_ADDRESS"
              value: "0.0.0.0"
            - name: "TRANSPORT_HTTPS_BIND_ADDRESS"
              value: "0.0.0.0"
            - name: "DEPLOYMENT_SERVICE_NAME"
              value: "play-scala-grpc-example"
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9443
              name: https
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
            failureThreshold: 30
