apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: play-java-grpc-ingress
spec:
  rules:
  - host: myservice.example.org
    http:
      paths:
      - backend:
          service:
            name: play-java-grpc-example
            port:
              number: 9000
        path: /
        pathType: Prefix
